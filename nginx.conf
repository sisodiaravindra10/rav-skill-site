# Processed by the nginx image's envsubst at startup: ${PORT} is filled from the
# environment (default 8080, see Dockerfile). Only ${PORT} is substituted, so
# nginx's own $uri is left untouched.
server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        # No client-side router here, so an unknown path should 404 rather than
        # silently render the homepage.
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Liveness and readiness probe for the platform
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these, so they can be cached hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
